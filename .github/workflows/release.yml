name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Package humanly.skill
        run: zip -r humanly.skill SKILL.md references/ examples/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: humanly.skill
          generate_release_notes: true
